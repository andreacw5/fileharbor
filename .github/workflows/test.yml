name: Run Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Same pnpm as the Dockerfile
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.14.0

      # Same Node as the Dockerfile
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.15.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      # `pnpm lint` runs with --fix: CI checks only
      - name: Lint
        run: pnpm exec eslint "src/**/*.ts"

      - name: Build
        run: pnpm build

      - name: Run unit tests
        run: pnpm test --passWithNoTests

      - name: Check openapi.json is up to date
        run: |
          pnpm openapi:dump
          if [ -n "$(git status --porcelain -- openapi.json)" ]; then
            echo "::error::openapi.json is stale: run 'pnpm openapi:dump' and commit it"
            git diff -- openapi.json | head -50
            exit 1
          fi
